name: MyCash API Automation
on:
workflow_dispatch:
inputs:
environment:
description: "Target environment"
required: true
type: choice
options:
QA
STAGING
default: QA
suite:
description: "Test suite to execute"
required: true
type: choice
options:
functional
performance
default: functional
permissions:
contents: read
jobs:
api-automation:
runs-on: ubuntu-latest
timeout-minutes: 60
steps:
name: Checkout repository
uses: actions/checkout@v4
name: Set up Java 21
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: "21"
cache: maven
name: Show Java and Maven versions
run: |
java -version
mvn -version
name: Run functional tests
if: inputs.suite == 'functional'
run: mvn test -Denv="${{ inputs.environment }}"
name: Run performance tests
if: inputs.suite == 'performance'
run: >
mvn test
-Denv="${{ inputs.environment }}"
-DtestngXmlSuiteFiles=src/test/resources/testng-performance.xml
name: Package test reports
if: always()
env:
SUITE: ${{ inputs.suite }}
run: |
python3 - <<'PY'
import os
import glob
import zipfile
import xml.etree.ElementTree as ET
os.makedirs("target", exist_ok=True)
paths = [
"target/surefire-reports",
"target/allure-results",
"target/extent-reports",
"target/performance-results.jtl",
"target/performance-report"
]
files = []
for path in paths:
if os.path.isfile(path):
files.append(path)
elif os.path.isdir(path):
files.extend(
f for f in glob.glob(
path + "//", recursive=True
) if os.path.isfile(f)
)
total = failures = errors = skipped = 0
for filename in glob.glob(
"target/surefire-reports/TEST-.xml"
):
try:
root = ET.parse(filename).getroot()
total += int(root.attrib.get("tests", 0))
failures += int(root.attrib.get("failures", 0))
errors += int(root.attrib.get("errors", 0))
skipped += int(root.attrib.get("skipped", 0))
except (ET.ParseError, ValueError, OSError):
pass
summary = (
f"Suite: {os.getenv('SUITE', 'unknown')}
"
f"JUnit tests: {total}
"
f"Failures: {failures}
"
f"Errors: {errors}
"
f"Skipped: {skipped}
"
f"Report files collected: {len(files)}
"
)
with open("target/email-summary.txt", "w") as f:
f.write(summary)
print(summary)
if files:
with zipfile.ZipFile(
"target/mycash-report.zip", "w",
zipfile.ZIP_DEFLATED
) as archive:
for filename in files:
archive.write(filename)
print("Report ZIP created.")
else:
print("No report files were generated.")
PY
name: Email automation report
if: always()
env:
SMTP_USERNAME: ${{ secrets.M365_SMTP_USERNAME }}
SMTP_PASSWORD: ${{ secrets.M365_SMTP_PASSWORD }}
EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
SUITE: ${{ inputs.suite }}
TARGET_ENV: ${{ inputs.environment }}
JOB_STATUS: ${{ job.status }}
REPOSITORY: ${{ github.repository }}
RUN_ID: ${{ github.run_id }}
RUN_ATTEMPT: ${{ github.run_attempt }}
SERVER_URL: ${{ github.server_url }}
run: |
python3 - <<'PY'
import os
import smtplib
from pathlib import Path
from email.message import EmailMessage
from email.utils import getaddresses
required = [
"SMTP_USERNAME", "SMTP_PASSWORD", "EMAIL_TO"
]
missing = [k for k in required if not os.getenv(k)]
if missing:
raise RuntimeError(
"Missing required GitHub Secrets: "
", ".join(missing)
)
suite = os.environ["SUITE"]
env_name = os.environ["TARGET_ENV"]
status = os.environ["JOB_STATUS"]
run_url = (
f"{os.environ['SERVER_URL']}/"
f"{os.environ['REPOSITORY']}/actions/runs/"
f"{os.environ['RUN_ID']}"
f"/attempts/{os.environ['RUN_ATTEMPT']}"
)
summary_file = Path("target/email-summary.txt")
summary = (
summary_file.read_text()
if summary_file.exists()
else "Test summary was not generated."
)
message = EmailMessage()
message["Subject"] = (
f"MyCash {suite.title()} Report | "
f"{env_name} | {status.upper()}"
)
message["From"] = os.environ["SMTP_USERNAME"]
recipients = [
address for _, address in
getaddresses([os.environ["EMAIL_TO"]])
if address
]
if not recipients:
raise RuntimeError("No valid email recipients configured.")
message["To"] = ", ".join(recipients)
message.set_content(
f"MyCash API Automation Report
"
f"Environment: {env_name}
"
f"Suite: {suite}
"
f"Workflow status: {status}
"
f"{summary}
"
f"GitHub run: {run_url}
"
)
archive = Path("target/mycash-report.zip")
if archive.exists():
size = archive.stat().st_size
if size <= 15 * 1024 * 1024:
message.add_attachment(
archive.read_bytes(),
maintype="application",
subtype="zip",
filename="mycash-report.zip"
)
else:
print(
"ZIP exceeds 15 MB; attachment omitted. "
"Use the GitHub run link."
)
with smtplib.SMTP(
"smtp.office365.com", 587, timeout=30
) as smtp:
smtp.ehlo()
smtp.starttls()
smtp.ehlo()
smtp.login(
os.environ["SMTP_USERNAME"],
os.environ["SMTP_PASSWORD"]
)
smtp.send_message(message)
print("Automation report email sent.")
PY
