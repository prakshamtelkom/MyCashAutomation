# MyCash Performance Test Configuration
# These are the default performance-test settings.
# Any -Dperf.* system property supplied on the Maven command line overrides these values.

# Environment
perf.env=qa

# Workbook
# Safe default smoke workbook. Change this to the required 3088/8080 workbook when ready.
perf.workbook=src/main/resources/2026_09_06_1APIsGateway3088.xlsx
perf.baseUrl=http://172.16.50.18:3088

# Sheet/API filters
perf.sheet=ALL
perf.api=ALL
perf.method=ALL

# Scenario: baseline | load | stress | spike | soak
perf.scenario=baseline

# Execution
perf.executionMode=sequence
perf.threads=1
perf.durationSeconds=60
perf.rampUpSeconds=10
perf.iterations=1

# Authentication
perf.authRequired=true
perf.user=admin

# Performance thresholds
perf.p95Ms=5000
perf.p99Ms=8000
perf.maxErrorRatePercent=5


